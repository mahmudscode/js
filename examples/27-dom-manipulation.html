<!DOCTYPE html>
<!--
  Chapter 27 — The DOM
  Open this file directly in any browser (double-click it, or
  File > Open). It is fully self-contained: no build step, no server,
  no dependencies. It demonstrates querySelector, createElement,
  classList, dataset, and event listeners via a small working to-do list.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chapter 27 — DOM To-Do List Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.25rem; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] { flex: 1; padding: 8px; font-size: 1rem; }
  button { padding: 8px 12px; font-size: 1rem; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid #ddd; }
  li .label { flex: 1; }
  li.completed .label { text-decoration: line-through; color: #888; }
  li button.remove { background: #e33; color: white; border: none; border-radius: 4px; }
  .empty { color: #888; font-style: italic; }
</style>
</head>
<body>
  <h1>To-Do List (DOM API demo)</h1>

  <form id="add-form">
    <input type="text" id="new-item-text" placeholder="Add a task..." autocomplete="off" />
    <button type="submit">Add</button>
  </form>

  <ul id="list"></ul>
  <p class="empty" id="empty-msg">Nothing here yet — add your first task above.</p>

  <script>
    // --- Selecting elements: querySelector / getElementById ---
    const form = document.querySelector("#add-form");
    const input = document.getElementById("new-item-text");
    const list = document.querySelector("#list");
    const emptyMsg = document.querySelector("#empty-msg");

    let nextId = 1;

    function updateEmptyState() {
      // classList.toggle(class, force) — show/hide based on a condition
      emptyMsg.classList.toggle("hidden", list.children.length > 0);
      emptyMsg.style.display = list.children.length > 0 ? "none" : "block";
    }

    function addItem(text) {
      // createElement + textContent (never innerHTML for user input — see 27.4)
      const li = document.createElement("li");
      li.dataset.id = String(nextId++); // custom data-id attribute via dataset

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = text; // safe: text is never parsed as HTML

      const toggleBtn = document.createElement("button");
      toggleBtn.textContent = "Done";
      toggleBtn.type = "button";

      const removeBtn = document.createElement("button");
      removeBtn.textContent = "Remove";
      removeBtn.type = "button";
      removeBtn.className = "remove";

      // Event listeners scoped to this specific item
      toggleBtn.addEventListener("click", () => {
        li.classList.toggle("completed"); // classList API
      });

      removeBtn.addEventListener("click", () => {
        li.remove(); // Element.remove() — removes from the DOM tree
        updateEmptyState();
      });

      li.append(label, toggleBtn, removeBtn); // append multiple nodes at once
      list.appendChild(li);
      updateEmptyState();
    }

    // Event handling: form submit
    form.addEventListener("submit", (event) => {
      event.preventDefault(); // stop the browser's default page-reload submit
      const text = input.value.trim();
      if (!text) return;
      addItem(text);
      input.value = "";
      input.focus();
    });

    // Seed a couple of example items on load
    addItem("Read Chapter 27");
    addItem("Try editing this file");
    updateEmptyState();
  </script>
</body>
</html>
